name: SMH Signal Monitor

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run signal monitor
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        ${{ secrets.ALERT_EMAIL }}
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
        run: python signal_monitor.py 

      - name: Commit state
        run: |
          git config user.name "Signal Bot"
          git config user.email "bot@smh-signal.local"
          git add state.json
          git diff --cached --quiet || git commit -m "signal update: $(date -u +%Y-%m-%d)"
          git push || true
